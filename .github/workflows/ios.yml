name: iOS

on:
  pull_request:
  push:
    branches: [main]

# Read-only token. This workflow never needs secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Lint
        run: swiftlint lint --strict

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          mkdir -p build
          xcodebuild test \
            -project FamilyPlanner.xcodeproj \
            -scheme FamilyPlanner \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath build/Test.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export screenshots
        if: always()
        continue-on-error: true
        run: |
          xcrun xcresulttool export attachments \
            --path build/Test.xcresult \
            --output-path build/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Test.xcresult
          if-no-files-found: warn

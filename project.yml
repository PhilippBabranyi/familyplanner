name: FamilyPlanner
options:
  bundleIdPrefix: de.babranyi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  FamilyPlanner:
    type: application
    platform: iOS
    sources:
      - FamilyPlanner
    dependencies:
      - package: Supabase
    entitlements:
      path: FamilyPlanner/FamilyPlanner.entitlements
      properties:
        # Push notifications. Xcode switches this to "production" when the app is distributed (TestFlight).
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.babranyi.familyplanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Familienplaner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app uses no custom encryption beyond what iOS provides (HTTPS only).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  FamilyPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FamilyPlannerTests
    dependencies:
      - target: FamilyPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.babranyi.familyplanner.tests
        GENERATE_INFOPLIST_FILE: YES
  FamilyPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FamilyPlannerUITests
    dependencies:
      - target: FamilyPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.babranyi.familyplanner.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FamilyPlanner:
    build:
      targets:
        FamilyPlanner: all
    test:
      targets:
        - FamilyPlannerTests
        - FamilyPlannerUITests

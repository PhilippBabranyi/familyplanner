name: FamilyPlanner
options:
  # Placeholder prefix. The real bundle identifier is chosen once the Apple Developer account exists.
  bundleIdPrefix: dev.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FamilyPlanner:
    type: application
    platform: iOS
    sources:
      - FamilyPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.familyplanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Familienplaner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  FamilyPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FamilyPlannerTests
    dependencies:
      - target: FamilyPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.familyplanner.tests
        GENERATE_INFOPLIST_FILE: YES
  FamilyPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FamilyPlannerUITests
    dependencies:
      - target: FamilyPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.familyplanner.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FamilyPlanner:
    build:
      targets:
        FamilyPlanner: all
    test:
      targets:
        - FamilyPlannerTests
        - FamilyPlannerUITests
